<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Vector Drawer</title>
  </head>

  <body onload="main()">
    <canvas id="example" width="400" height="400"></canvas>

    <br>

    v1 X: <input type="text" id="xCoord1" value="2">
    v1 Y: <input type="text" id="yCoord1" value="2">

    <br>

    v2 X: <input type="text" id="xCoord2" value="1">
    v2 Y: <input type="text" id="yCoord2" value="1">

    <br>

    <button onclick="handleDrawEvent()">Draw</button>

    <br>

    <select id="operationSelect">
      <option value="add">Add</option>
      <option value="sub">Subtract</option>
      <option value="mul">Multiply</option>
      <option value="div">Divide</option>
      <option value="magnitude">Magnitude</option>
      <option value="normalize">Normalize</option>
      <option value="angle">Angle between</option>
      <option value="area">Area</option>
    </select>

    <input type="number" id="scalarInput" value="2">
    <button onclick="handleDrawOperationEvent()">Draw Operation</button>

    <script src="../lib/cuon-matrix-cse160.js"></script>
    <script src="asg0.js"></script>
  </body>
</html>
